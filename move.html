<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Three.js VR Movement</title>
    <style>body { margin: 0; }</style>
</head>
<body>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x101020);

        // --- 1. СОЗДАЕМ ПЛАТФОРМУ (RIG) ---
        // Камера и контроллеры будут внутри неё
        const cameraRig = new THREE.Group();
        scene.add(cameraRig);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.6, 3); // Высота глаз
        cameraRig.add(camera);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        // --- 2. ДОБАВЛЯЕМ КОНТРОЛЛЕРЫ В RIG ---
        const controller0 = renderer.xr.getController(0); // Левый
        const controller1 = renderer.xr.getController(1); // Правый
        cameraRig.add(controller0);
        cameraRig.add(controller1);

        // Простейший пол и свет
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(20, 20),
            new THREE.MeshStandardMaterial({ color: 0x333333 })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);
        scene.add(new THREE.AmbientLight(0xffffff, 1));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);

        // --- 3. ЛОГИКА ПЕРЕМЕЩЕНИЯ ---
        const clock = new THREE.Clock();
        const moveSpeed = 2.0; // м/с
        const deadZone = 0.15; // Мертвая зона стика

        // Временный вектор для направления
        const forward = new THREE.Vector3();
        const right = new THREE.Vector3();

        renderer.setAnimationLoop(() => {
            const delta = clock.getDelta();

            // Получаем данные с левого контроллера (индекс 0)
            const session = renderer.xr.getSession();
            if (session && session.inputSources.length > 0) {
                // Ищем источник с геймпадом (обычно это контроллеры)
                for (const source of session.inputSources) {
                    // Проверяем, что это левый контроллер и у него есть стик
                    if (source.handedness === 'left' && source.gamepad && source.gamepad.axes.length >= 4) {
                        const x = source.gamepad.axes[2]; // Влево/вправо
                        const y = source.gamepad.axes[3]; // Вперед/назад (инвертирован)

                        if (Math.abs(x) > deadZone || Math.abs(y) > deadZone) {
                            // Направление "вперед" берем из камеры, но обнуляем Y (чтобы не летать)
                            camera.getWorldDirection(forward);
                            forward.y = 0;
                            forward.normalize();

                            // Вектор "вправо"
                            right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

                            // Двигаем платформу (RIG), а не камеру
                            // y инвертирован: стик вверх (y=-1) должен двигать вперед
                            cameraRig.position.addScaledVector(forward, -y * moveSpeed * delta);
                            cameraRig.position.addScaledVector(right, x * moveSpeed * delta);
                        }
                    }
                }
            }

            renderer.render(scene, camera);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
